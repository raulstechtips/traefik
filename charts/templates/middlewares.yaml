{{- if .Values.middlewares.enabled }}
{{- $namespace := required "middlewares.namespace is required when middlewares.enabled is true" .Values.middlewares.namespace }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: default-headers
  namespace: {{ $namespace }}
  labels:
    {{- include "traefik-wrapper.labels" . | nindent 4 }}
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 15552000
    referrerPolicy: no-referrer
    contentSecurityPolicy: {{ required "middlewares.defaultHeaders.contentSecurityPolicy is required when middlewares.enabled is true" .Values.middlewares.defaultHeaders.contentSecurityPolicy | quote }}
    customFrameOptionsValue: SAMEORIGIN
    customRequestHeaders:
      X-Forwarded-Proto: https
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strict-referrer
  namespace: {{ $namespace }}
  labels:
    {{- include "traefik-wrapper.labels" . | nindent 4 }}
spec:
  headers:
    referrerPolicy: {{ .Values.middlewares.strictReferrer.referrerPolicy | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth-verify
  namespace: {{ $namespace }}
  labels:
    {{- include "traefik-wrapper.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: {{ .Values.middlewares.oauth.verifyAddress | quote }}
    trustForwardHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth-chain
  namespace: {{ $namespace }}
  labels:
    {{- include "traefik-wrapper.labels" . | nindent 4 }}
spec:
  chain:
    middlewares:
      - name: oauth-verify
        namespace: {{ $namespace }}
{{- end }}
