suite: Shared Traefik middlewares
templates:
  - templates/middlewares.yaml
release:
  name: traefik
  namespace: traefik
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders all six shared middlewares
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - hasDocuments:
          count: 6

  - it: omits the VPN middleware when no ranges are configured
    values:
      - ../ci/all-on-values.yaml
    set:
      middlewares.vpnIpAcl.sourceRange: []
    asserts:
      - hasDocuments:
          count: 5

  - it: renders the live default headers policy
    values:
      - ../ci/all-on-values.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.namespace
          value: default
      - equal:
          path: spec.headers.contentSecurityPolicy
          value: "default-src 'none';"
      - equal:
          path: spec.headers.customRequestHeaders.X-Forwarded-Proto
          value: https

  - it: uses the live oauth verification endpoint
    values:
      - ../ci/all-on-values.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.name
          value: oauth-verify
      - equal:
          path: spec.forwardAuth.address
          value: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth

  - it: renders the VPN ranges
    values:
      - ../ci/all-on-values.yaml
    documentIndex: 5
    asserts:
      - equal:
          path: spec.ipAllowList.sourceRange
          value:
            - 192.0.2.10/32
            - 10.0.0.0/8
