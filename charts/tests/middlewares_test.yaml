suite: Shared Traefik middlewares
templates:
  - templates/middlewares.yaml
release:
  name: traefik
  namespace: traefik
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders all four shared middlewares
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - hasDocuments:
          count: 4

  - it: renders the live default headers policy
    values:
      - ../ci/all-on-values.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.namespace
          value: default
      - equal:
          path: spec.headers.contentSecurityPolicy
          value: "default-src 'none';"
      - equal:
          path: spec.headers.customRequestHeaders.X-Forwarded-Proto
          value: https

  - it: sends forward auth to the oauth2-proxy root so login redirects back
    values:
      - ../ci/all-on-values.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.name
          value: oauth-verify
      - equal:
          path: spec.forwardAuth.address
          value: http://oauth2-proxy.oauth2-proxy.svc.cluster.local/

  - it: chains only the forward auth middleware
    values:
      - ../ci/all-on-values.yaml
    documentIndex: 3
    asserts:
      - equal:
          path: metadata.name
          value: oauth-chain
      - equal:
          path: spec.chain.middlewares
          value:
            - name: oauth-verify
              namespace: default
